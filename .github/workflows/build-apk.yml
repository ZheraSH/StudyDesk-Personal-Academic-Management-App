name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build StudyDesk APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=1.0.0"
          pip install -r requirements.txt

      - name: Build Android APK
        env:
          PYTHONIOENCODING: "utf-8"
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          flet build apk --verbose --yes --no-rich-output

      - name: Verify APK Generated
        run: |
          echo "=== Mencari file APK yang berhasil di-build ==="
          find . -name "*.apk" -type f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyDesk-release-apk
          path: |
            build/**/*.apk
            dist/**/*.apk
          if-no-files-found: error
