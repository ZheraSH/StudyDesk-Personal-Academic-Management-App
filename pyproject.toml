[project]
name = "studydesk"
version = "1.0.0"
description = "Personal Academic Management Application"
requires-python = ">=3.11"
dependencies = [
    "flet>=1.0.0",
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.9.0",
    "appdirs>=1.4.4",
    "plyer>=2.1.0",
]

[project.scripts]
studydesk = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v"

[tool.flet]
app_name = "StudyDesk"
app_id = "com.studydesk.app"
description = "Personal Academic Management Application"
product = "StudyDesk"
company = "Personal"
copyright = "2026"
org = "com.studydesk"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.VIBRATE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
